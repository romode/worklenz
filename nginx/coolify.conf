# Interner Router für Worklenz hinter Coolify (Traefik macht HTTPS)
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    set $backend   backend:3000;
    set $frontend  frontend:5000;
    set $storage   seaweedfs:8333;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Backend-Routen
    location ~ ^/(api|secure|public|uploads)/ {
        proxy_pass http://$backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /csrf-token {
        proxy_pass http://$backend;
    }

    # Websockets (Echtzeit-Updates)
    location ~ ^/(socket\.io|socket)/ {
        proxy_pass http://$backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # Dateianhänge (signierte S3-URLs, Host-Header muss erhalten bleiben)
    location /worklenz-bucket/ {
        proxy_pass http://$storage;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Frontend (React-App)
    location / {
        proxy_pass http://$frontend;
    }
}
